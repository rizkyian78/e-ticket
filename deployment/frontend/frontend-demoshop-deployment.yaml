apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoshop
  namespace: e-ticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoshop
  template:
    metadata:
      labels:
        app: demoshop
    spec:
      containers:
        - name: demoshop
          image: rizkyian78/e-ticketing-frontend:10ced76ff2daf0e3c252cf88844e341bd109fb4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
