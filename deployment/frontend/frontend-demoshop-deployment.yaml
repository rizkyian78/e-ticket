apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoshop
  namespace: e-ticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoshop
  template:
    metadata:
      labels:
        app: demoshop
    spec:
      containers:
        - name: demoshop
          image: ghcr.io/YOUR_ORG/demoshop:latest
          ports:
            - containerPort: 3000
