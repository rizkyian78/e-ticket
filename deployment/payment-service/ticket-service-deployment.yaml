apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: e-ticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: rizkyian78/e-ticketing-ticket:9f84bcf
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
