apiVersion: apps/v1
kind: Deployment
metadata:
  name: debitcard-worker
  namespace: e-ticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: debitcard-worker
  template:
    metadata:
      labels:
        app: debitcard-worker
    spec:  # remove if image is public
      containers:
        - name: debitcard-worker
          image: docker.io/rizkyian78/e-ticketing-debitcard-worker:fe224a0
          imagePullPolicy: Always
          env:
           - name: AMQP_URL
             value: amqp://guest:guest@rabbitmq.e-ticket.svc.cluster.local:5672/
           - name: DATABASE_URL
             value: postgresql://postgres:password@postgres.e-ticket.svc.cluster.local:5432/worker?sslmode=disable
