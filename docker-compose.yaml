version: "3.9"

services:
  db:
    image: postgres:18.1-alpine
    container_name: ipg
    restart: always
    environment:
      POSTGRES_DB: ipg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ipg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:



