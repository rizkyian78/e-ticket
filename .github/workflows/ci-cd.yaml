name: CI Pipeline (Monorepo – Tests, Coverage, Sonar, Docker)

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: rizkyian78_e-ticket
  SONAR_ORGANIZATION: rizkyian78
  IMAGE_PREFIX: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/e-ticketing

# =========================================================
# PR: TESTS + LINT + COVERAGE (PARALLEL MATRIX)
# =========================================================
jobs:
  pr-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR – Quality Gate

    strategy:
      fail-fast: false
      matrix:
        service:
          # ---------- FRONTEND ----------
          - name: demoshop
            path: demoshop
            type: node
          - name: checkout-app
            path: checkout-app
            type: node
          - name: backoffice-app
            path: backoffice-app
            type: node

          # ---------- BACKEND ----------
          - name: payment-service
            path: payment-service
            type: node
          - name: ledger-service
            path: ledger-service
            type: python
          - name: ticket-service
            path: ticket-service
            type: dotnet

          # ---------- WORKERS ----------
          - name: creditcard-worker
            path: payment-method-worker
            type: go
          - name: qris-worker
            path: payment-method-worker
            type: go
          - name: debitcard-worker
            path: payment-method-worker
            type: go

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================= NODE =================
      - uses: actions/setup-node@v4
        if: matrix.service.type == 'node'
        with:
          node-version: 20

      - name: Node – Lint, Test, Coverage
        if: matrix.service.type == 'node'
        run: |
          cd ${{ matrix.service.path }}
          yarn install --frozen-lockfile
          yarn lint
          yarn test --coverage

      # ================= PYTHON =================
      - uses: actions/setup-python@v5
        if: matrix.service.type == 'python'
        with:
          python-version: "3.11"

      - name: Python – Lint, Test, Coverage
        if: matrix.service.type == 'python'
        run: |
          cd ${{ matrix.service.path }}
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8
          flake8 .
          pytest --cov=. --cov-report=xml

      # ================= DOTNET =================
      - uses: actions/setup-dotnet@v4
        if: matrix.service.type == 'dotnet'
        with:
          dotnet-version: "8.0.x"

      - name: .NET – Test, Coverage
        if: matrix.service.type == 'dotnet'
        run: |
          cd ${{ matrix.service.path }}
          dotnet test --collect:"XPlat Code Coverage"

      # ================= GO =================
      - uses: actions/setup-go@v5
        if: matrix.service.type == 'go'
        with:
          go-version: "1.22"

      - name: Go – Test
        if: matrix.service.type == 'go'
        run: |
          cd ${{ matrix.service.path }}
          go test ./...

# =========================================================
# SONARCLOUD (RUN ON PR AFTER TESTS)
# =========================================================
  sonar:
    if: github.event_name == 'pull_request'
    needs: pr-quality
    runs-on: ubuntu-latest
    name: SonarCloud Scan

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.javascript.lcov.reportPaths=demoshop/coverage/lcov.info,checkout-app/coverage/lcov.info,backoffice-app/coverage/lcov.info,payment-service/coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=ledger-service/coverage.xml

# =========================================================
# MAIN: DOCKER BUILD & PUSH (PARALLEL)
# =========================================================
  docker-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build & Push Docker Images

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: frontend
            path: demoshop
          - name: checkout
            path: checkout-app
          - name: backoffice
            path: backoffice-app
          - name: payment
            path: payment-service
          - name: ledger
            path: ledger-service
          - name: ticket
            path: ticket-service
          - name: creditcard-worker
            path: payment-method-worker
            build_arg: creditcard
          - name: qris-worker
            path: payment-method-worker
            build_arg: qris
          - name: debitcard-worker
            path: payment-method-worker
            build_arg: debitcard

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Image
        run: |
          if [ -n "${{ matrix.image.build_arg }}" ]; then
            docker build \
              -t $IMAGE_PREFIX-${{ matrix.image.name }}:$IMAGE_TAG \
              --build-arg CMD_NAME=${{ matrix.image.build_arg }} \
              ${{ matrix.image.path }}
          else
            docker build \
              -t $IMAGE_PREFIX-${{ matrix.image.name }}:$IMAGE_TAG \
              ${{ matrix.image.path }}
          fi

          docker push $IMAGE_PREFIX-${{ matrix.image.name }}:$IMAGE_TAG
