# =========================
# DOCKER LOGIN
# =========================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          # =========================
# BUILD & PUSH IMAGES
# =========================
      - name: Build & Push Frontend Image
        run: |
           docker build --build-arg VITE_API_TICKET_SERVICE_URL=https://rizkyiann8nautomation.my.id/ \
            --build-arg VITE_API_PAYMENT_SERVICE_URL=https://rizkyiann8nautomation.my.id/ \
            --build-arg VITE_API_KEY=sk_live_9f8a7b6c5d4e3f2a1 \
            -t $IMAGE_PREFIX-frontend:$IMAGE_TAG demoshop
            docker push $IMAGE_PREFIX-frontend:$IMAGE_TAG
      - name: Build & Push Frontend Checkout Image
        run: |
          docker build \
          --build-arg VITE_API_BASE_URL=https://rizkyiann8nautomation.my.id/ \
          -t $IMAGE_PREFIX-checkout-app:$IMAGE_TAG checkout-app
          docker push $IMAGE_PREFIX-checkout-app:$IMAGE_TAG
      - name: Build & Push Frontend Backoffice Image
        run: |
          docker build -t $IMAGE_PREFIX-backoffice-app:$IMAGE_TAG backoffice-app
          docker push $IMAGE_PREFIX-backoffice-app:$IMAGE_TAG         

      - name: Build & Push Payment Image
        run: |
          docker build -t $IMAGE_PREFIX-payment:$IMAGE_TAG payment-service
          docker push $IMAGE_PREFIX-payment:$IMAGE_TAG

      - name: Build & Push Ledger Image
        run: |
          docker build -t $IMAGE_PREFIX-ledger:$IMAGE_TAG ledger-service
          docker push $IMAGE_PREFIX-ledger:$IMAGE_TAG

      - name: Build & Push Ticket Image
        run: |
          docker build -t $IMAGE_PREFIX-ticket:$IMAGE_TAG ticket-service
          docker push $IMAGE_PREFIX-ticket:$IMAGE_TAG
      - name: Build & Push Creditcard Worker Image
        run: |

          docker build \
          -t $IMAGE_PREFIX-creditcard-worker:$IMAGE_TAG \
          --build-arg CMD_NAME=creditcard \
          payment-method-worker

          docker push $IMAGE_PREFIX-creditcard-worker:$IMAGE_TAG
      - name: Build & Push QRIS Worker Image
        run: |
          docker build \
          --build-arg CMD_NAME=qris \
          -t $IMAGE_PREFIX-qris-worker:$IMAGE_TAG \
          payment-method-worker

          docker push $IMAGE_PREFIX-qris-worker:$IMAGE_TAG
      - name: Build & Push Debitcard Worker Image
        run: |
          docker build \
          --build-arg CMD_NAME=debitcard \
          -t $IMAGE_PREFIX-debitcard-worker:$IMAGE_TAG \
          payment-method-worker

          docker push $IMAGE_PREFIX-debitcard-worker:$IMAGE_TAG

# =========================
# UPLOAD COVERAGE
# =========================
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: full-code-coverage
          path: |
            demoshop/coverage
            payment-service/coverage
            ledger-service/coverage.xml
            ticket-service/**/coverage.opencover.xml
