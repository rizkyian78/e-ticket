name: CI Pipeline (Tests + Parallel Docker Build + GitOps)

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  IMAGE_PREFIX: docker.io/rizkyian78/e-ticketing

jobs:
# =========================
# PR PIPELINE
# =========================
  pr-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Demoshop Tests
        run: |
          cd demoshop
          yarn install
          yarn test

      - name: Payment Tests
        run: |
          cd payment-service
          yarn install
          yarn test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ledger Tests
        run: |
          cd ledger-service
          pip install -r requirements.txt pytest
          pytest

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Ticket Tests
        run: |
          cd ticket-service
          dotnet test

# =========================
# MERGE PIPELINE
# =========================
  merge-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Demoshop Coverage
        run: |
          cd demoshop
          yarn install
          yarn test --coverage

# =========================
# PARALLEL DOCKER BUILD & PUSH
# =========================
  docker-build-push:
    needs: merge-tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: demoshop
            context: demoshop
            image: demoshop
            build_args: |
              VITE_API_TICKET_SERVICE_URL=https://rizkyiann8nautomation.my.id/
              VITE_API_PAYMENT_SERVICE_URL=https://rizkyiann8nautomation.my.id/
              VITE_API_KEY=sk_live_9f8a7b6c5d4e3f2a1

          - name: checkout-app
            context: checkout-app
            image: checkout-app
            build_args: |
              VITE_API_BASE_URL=https://rizkyiann8nautomation.my.id/

          - name: backoffice-app
            context: backoffice-app
            image: backoffice-app

          - name: payment
            context: payment-service
            image: payment

          - name: ledger
            context: ledger-service
            image: ledger

          - name: ticket
            context: ticket-service
            image: ticket

          - name: creditcard-worker
            context: payment-method-worker
            image: creditcard-worker
            build_args: |
              CMD_NAME=creditcard

          - name: qris-worker
            context: payment-method-worker
            image: qris-worker
            build_args: |
              CMD_NAME=qris

          - name: debitcard-worker
            context: payment-method-worker
            image: debitcard-worker
            build_args: |
              CMD_NAME=debitcard

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          docker login \
            -u "rizkyian78" \
            -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Image
        shell: bash
        run: |
          BUILD_ARGS=()

          if [ -n "${{ matrix.build_args }}" ]; then
            while IFS= read -r arg; do
              [[ -z "$arg" ]] && continue
              BUILD_ARGS+=(--build-arg "$arg")
            done <<< "${{ matrix.build_args }}"
          fi

          docker build --no-cache \
            "${BUILD_ARGS[@]}" \
            -t $IMAGE_PREFIX-${{ matrix.image }}:$IMAGE_TAG \
            ${{ matrix.context }}

          docker push $IMAGE_PREFIX-${{ matrix.image }}:$IMAGE_TAG

# =========================
# GITOPS UPDATE (ARGO CD)
# =========================
  update-k8s-manifests:
    name: Update Kubernetes Manifests (ArgoCD)
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update manifests
        run: |
          sed -i "s|image: .*e-ticketing-demoshop:.*|image: $IMAGE_PREFIX-demoshop:$IMAGE_TAG|g" deployment/deployments/frontend-demoshop-deployment.yaml
          sed -i "s|image: .*e-ticketing-checkout-app:.*|image: $IMAGE_PREFIX-checkout-app:$IMAGE_TAG|g" deployment/deployments/frontend-checkout-deployment.yaml
          sed -i "s|image: .*e-ticketing-backoffice-app:.*|image: $IMAGE_PREFIX-backoffice-app:$IMAGE_TAG|g" deployment/deployments/frontend-backoffice-deployment.yaml

          sed -i "s|image: .*e-ticketing-payment:.*|image: $IMAGE_PREFIX-payment:$IMAGE_TAG|g" deployment/deployments/payment-service-deployment.yaml
          sed -i "s|image: .*e-ticketing-ledger:.*|image: $IMAGE_PREFIX-ledger:$IMAGE_TAG|g" deployment/deployments/ledger-service-deployment.yaml
          sed -i "s|image: .*e-ticketing-ticket:.*|image: $IMAGE_PREFIX-ticket:$IMAGE_TAG|g" deployment/deployments/ticket-service-deployment.yaml

          sed -i "s|image: .*e-ticketing-creditcard-worker:.*|image: $IMAGE_PREFIX-creditcard-worker:$IMAGE_TAG|g" deployment/deployments/creditcard-worker-deployment.yaml
          sed -i "s|image: .*e-ticketing-qris-worker:.*|image: $IMAGE_PREFIX-qris-worker:$IMAGE_TAG|g" deployment/deployments/qris-worker-deployment.yaml
          sed -i "s|image: .*e-ticketing-debitcard-worker:.*|image: $IMAGE_PREFIX-debitcard-worker:$IMAGE_TAG|g" deployment/deployments/debitcard-worker-deployment.yaml

      - name: Commit & push
        run: |
          git config user.name "Rizky Ian Indiarto"
          git config user.email "rizkyian78@gmail.com"

          git add .
          git commit -m "chore(deploy): update images to ${IMAGE_TAG}" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
