name: CI Pipeline (Tests + Coverage + SonarQube + Docker)

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: rizkyian78_e-ticket
  IMAGE_PREFIX: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/e-ticketing

jobs:

# =========================
# PR PIPELINE
# =========================
  pr-tests:
    if: github.event_name == 'pull_request'
    name: PR - Full Test Suite
    runs-on: ubuntu-latest
    environment: e-ticket

    steps:
      - uses: actions/checkout@v4

# ---------- FRONTEND ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend Tests
        run: |
          cd demoshop
          yarn install
          yarn lint || true
          yarn test

# ---------- PAYMENT ----------
      - name: Payment Tests
        run: |
          cd payment-service
          yarn install
          yarn lint || true
          yarn test

# ---------- LEDGER ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ledger Tests
        run: |
          cd ledger-service
          pip install -r requirements.txt
          pip install pytest
          pytest

# ---------- TICKET (.NET) ----------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Ticket Tests
        run: |
          cd ticket-service
          dotnet restore
          dotnet test

# =========================
# MERGE PIPELINE
# =========================
  merge-tests-coverage-sonar:
    if: github.event_name == 'push'
    name: Merge - Test + Coverage + Sonar + Docker Push
    runs-on: ubuntu-latest
    environment: e-ticket

    steps:
