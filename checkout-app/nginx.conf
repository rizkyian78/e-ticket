server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets
  location /checkout/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routes under /checkout
  location /checkout/ {
    try_files $uri $uri/ /index.html;
  }

  # Everything else = 404
  location / {
    return 404;
  }
}
